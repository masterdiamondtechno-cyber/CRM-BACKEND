spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
  # Do not publish API docs in production by default.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
crm:
  files:
    directory: ${CRM_FILES_DIRECTORY:/app/data/files}
  registration:
    enabled: ${PUBLIC_REGISTRATION_ENABLED:false}
    verification-url: ${REGISTRATION_VERIFICATION_URL:}
    verification-minutes: ${REGISTRATION_VERIFICATION_MINUTES:30}
  invitation:
    frontend-url: ${INVITATION_FRONTEND_URL:}
    expiration-hours: ${INVITATION_EXPIRATION_HOURS:72}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  password-reset:
    frontend-url: ${PASSWORD_RESET_URL:}
    token-minutes: ${RESET_TOKEN_MINUTES:30}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}


